name: Fetch LuSE prices

on:
  schedule:
    - cron: "0 15 * * 1-5"   # 15:00 UTC = 17:00 Lusaka, Mon-Fri
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python fetch_prices.py
      - name: Commit prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "Update prices" || echo "No changes"
          git push
